    <script>
      // Ensure window.fetch has a setter so browser extensions or interceptors don't throw "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          if (_origFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _origFetch;
              },
              set: function(fn) {
                _origFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}
      })();
    </script>
